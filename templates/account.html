{% extends "base.html" %}
{% block title %}Account - Disc Diary{% endblock %}
{% block main_class %}auth-shell{% endblock %}
{% block content %}
<h1>Hi, {{ user.username }}</h1>
<p class="meta">You’re signed in. Diary logging is coming next.</p>
<form method="post" action="/logout">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <button type="submit" class="secondary">Log out</button>
</form>
{% endblock %}
